# Daily ESPN Cricinfo Data Scraping
#
# Scrapes ball-by-ball commentary + Hawkeye data from ESPN Cricinfo using
# Playwright + stealth in headed mode (via Xvfb virtual display).
#
# Per match, produces 3 tables:
#   {match_id}_balls.parquet   - Ball-by-ball with Hawkeye fields
#   {match_id}_match.parquet   - Match metadata (venue, toss, result, officials)
#   {match_id}_innings.parquet - Batting scorecards with player details
#
# Output: cricinfo/{format}_{gender}/{match_id}_{table}.parquet
#
# Schedule: Daily at 12 PM UTC (after international matches)
# Runtime: ~10-60 min depending on number of new matches
#
# On schedule: scrapes top N series per format from series_list.csv (default: 3)
# Also refreshes fixture STATUSES across a much wider series window
# (--fixtures-only, default 150 series per format) AFTER the scrape, so matches
# that were recorded as upcoming do not stay frozen at status='PRE' forever.
#
# On manual trigger: accepts series IDs, format filter, max matches, force flag

name: Cricinfo Scrape

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      series_ids:
        description: 'Comma-separated series IDs (leave empty for auto from CSV)'
        required: false
        type: string
      format:
        description: 'Filter by format (t20i, odi, test, or empty for all)'
        required: false
        type: string
      max_matches:
        description: 'Max matches per series'
        required: false
        default: '50'
        type: string
      max_series:
        description: 'Max series per format (for scheduled/auto mode)'
        required: false
        default: '3'
        type: string
      force:
        description: 'Re-scrape existing matches'
        required: false
        default: false
        type: boolean

      fixtures_max_series:
        description: 'Max series per format for the fixture-status refresh (raise for a deep catch-up)'
        required: false
        default: '150'
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: release-cricinfo
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Check cricinfo release asset-count headroom
        run: |
          # GitHub caps releases at 1000 assets. Per-match uploads (3 assets/match)
          # eat headroom fast; fail loudly here, BEFORE any scraping/upload work,
          # instead of letting per-match uploads start silently warn-and-skip near
          # the cap (see ../../../docs/reviews/FABLE-REVIEW.md finding H7).
          # `|| echo 0` on ANY gh failure would make a transient API error, an
          # auth problem or a rate limit look identical to "0 assets" — walking
          # straight past the one guard whose whole purpose is to stop us
          # reaching the cap. Only a genuinely-absent release counts as 0.
          if ASSET_JSON=$(gh release view cricinfo --json assets 2>"$RUNNER_TEMP/gh_err"); then
            ASSET_COUNT=$(echo "$ASSET_JSON" | jq '.assets | length')
          elif grep -qi "release not found" "$RUNNER_TEMP/gh_err"; then
            ASSET_COUNT=0
            echo "cricinfo release does not exist yet — treating as 0 assets"
          else
            echo "::error::could not read the cricinfo release asset count, so the cap guard cannot run. Refusing to proceed. gh said: $(cat "$RUNNER_TEMP/gh_err")"
            exit 1
          fi
          echo "cricinfo release currently has $ASSET_COUNT / 1000 assets (GitHub's per-release cap)"
          echo "- **Asset count**: $ASSET_COUNT / 1000" >> $GITHUB_STEP_SUMMARY
          if [ "$ASSET_COUNT" -ge 950 ]; then
            echo "::error::cricinfo release has $ASSET_COUNT assets (>= 950 threshold, GitHub's hard cap is 1000). Refusing to run to avoid silent upload failures and data loss. This needs a ONE-TIME MANUAL consolidation: run 'python scripts/consolidate_cricinfo_assets.py' (dry-run) then '--execute --yes' locally against the live release — see that script's docstring and bouncerdata/CLAUDE.md 'Cricinfo asset cap' section for the full runbook. This is a human-run step; CI will not run it for you."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-cricinfo-${{ hashFiles('scripts/requirements-cricinfo.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-cricinfo-

      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements-cricinfo.txt
          playwright install chromium --with-deps

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Restore previous data from release
        run: |
          # Create all possible format_gender directories
          for dir in t20i_male t20i_female odi_male odi_female test_male test_female; do
            mkdir -p "cricinfo/$dir"
          done
          mkdir -p /tmp/cricinfo_dl
          # Download all assets to temp dir, then sort by directory prefix
          gh release download cricinfo -D /tmp/cricinfo_dl --pattern "*.parquet" 2>/dev/null || true
          RESTORED=0
          for f in /tmp/cricinfo_dl/*.parquet; do
            [ -f "$f" ] || continue
            BASENAME=$(basename "$f")
            # Asset names are prefixed with dir: t20i_male__12345_balls.parquet
            MATCHED=false
            for dir in t20i_male t20i_female odi_male odi_female test_male test_female; do
              if echo "$BASENAME" | grep -q "^${dir}__"; then
                LOCALNAME=$(echo "$BASENAME" | sed "s/^${dir}__//")
                mv "$f" "cricinfo/$dir/$LOCALNAME"
                RESTORED=$((RESTORED + 1))
                MATCHED=true
                break
              fi
            done
            # Handle fixtures.parquet (top-level, no prefix)
            if [ "$MATCHED" = "false" ]; then
              if [ "$BASENAME" = "fixtures.parquet" ]; then
                mv "$f" "cricinfo/fixtures.parquet"
                RESTORED=$((RESTORED + 1))
                MATCHED=true
              fi
            fi
            # Backwards compat: old format-only prefixes (t20i__, odi__, test__)
            if [ "$MATCHED" = "false" ]; then
              for fmt in t20i odi test; do
                if echo "$BASENAME" | grep -q "^${fmt}__"; then
                  LOCALNAME=$(echo "$BASENAME" | sed "s/^${fmt}__//")
                  mv "$f" "cricinfo/${fmt}_male/$LOCALNAME"
                  RESTORED=$((RESTORED + 1))
                  MATCHED=true
                  break
                fi
              done
            fi
            # Restore combined parquets (e.g. cricinfo_balls_t20i_male.parquet)
            if [ "$MATCHED" = "false" ]; then
              if echo "$BASENAME" | grep -q "^cricinfo_"; then
                mkdir -p "cricinfo/combined"
                mv "$f" "cricinfo/combined/$BASENAME"
                RESTORED=$((RESTORED + 1))
              fi
            fi
          done
          rm -rf /tmp/cricinfo_dl
          echo "Restored $RESTORED parquet files from previous runs"
          # Checksum manifest of everything that came DOWN from the release, so the
          # upload step can skip files that are byte-identical to what is already
          # there (bouncerverse#84 / D-P64, 2026-09-03).
          #
          # Why: the upload step used to re-upload every per-match asset with
          # --clobber on every run. On 2026-09-02 that meant all 768 assets showed
          # updatedAt within the same 24 hours despite nothing new being scraped
          # since 2026-02. That is not just wasted bandwidth -- it made
          # consolidate_cricinfo_assets.py structurally unable to reclaim anything,
          # because its --min-age-hours guard (default 24, there to avoid racing a
          # live scrape) classified 749 of 768 assets as SKIP_RECENT. Headroom
          # against GitHub's 1000-asset cap could never be freed while every asset
          # was touched daily.
          #
          # Checksums rather than mere presence, so a genuinely re-scraped match
          # (--force, or a corrected match) still uploads.
          #
          # combined/ is deliberately EXCLUDED: those 18 bundles are what
          # bouncer::load_cricinfo_remote() actually reads, they are rebuilt every
          # run, and they are cheap. Always re-upload them.
          # Count what SHOULD be hashed independently of the hashing pipeline, so a
          # failure of the pipeline itself is distinguishable from "there was
          # genuinely nothing to hash". Without this the two look identical and the
          # optimisation silently reverts to re-uploading everything -- the exact
          # bug this manifest exists to fix, reintroduced invisibly.
          RESTORABLE=$(find cricinfo -name '*.parquet' -type f -not -path 'cricinfo/combined/*' | wc -l)
          : > /tmp/cricinfo_restored.md5
          MANIFEST_OK=true
          if [ "$RESTORABLE" -gt 0 ]; then
            find cricinfo -name '*.parquet' -type f -not -path 'cricinfo/combined/*' -print0 \
              | xargs -0 -r md5sum | sort > /tmp/cricinfo_restored.md5 || MANIFEST_OK=false
          fi
          HASHED=$(wc -l < /tmp/cricinfo_restored.md5)
          echo "Recorded $HASHED checksums for unchanged-file detection ($RESTORABLE restorable files)"
          if [ "$MANIFEST_OK" != "true" ] || [ "$HASHED" -ne "$RESTORABLE" ]; then
            # Not fatal: an empty/partial manifest only means more files get
            # re-uploaded than necessary, which is the old behaviour and is safe.
            # But it must be visible, because the symptom otherwise is a silent
            # return to churning every asset daily.
            echo "::warning::Checksum manifest is incomplete ($HASHED of $RESTORABLE files hashed). Unchanged-asset skipping will be partially or fully disabled this run, so the release asset count and updatedAt churn may regress. See bouncerverse#84 / D-P64."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discover new series
        id: discover
        continue-on-error: true
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" \
            python scripts/discover_series.py --update --scan-parquets --cricinfo-dir cricinfo

      - name: Commit updated series list
        if: steps.discover.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/series_list.csv
          git diff --cached --quiet || git commit -m "Auto-update series_list.csv with newly discovered series"
          git push origin HEAD:dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dispatch inputs reach the shell through `env:`, never by interpolating
      # ${{ }} into the script body. Template expansion happens BEFORE bash sees
      # the script, so an input containing shell metacharacters would run as code
      # on the runner instead of being passed as an argument.
      #
      # Each value is validated as well, because a value that is safe from code
      # injection can still smuggle extra CLI flags into $ARGS through the
      # unquoted word-splitting on the final line.
      - name: Run scraper
        id: scrape
        env:
          MAX_MATCHES: ${{ inputs.max_matches || '50' }}
          MAX_SERIES: ${{ inputs.max_series || '3' }}
          SERIES_INPUT: ${{ inputs.series_ids }}
          FORMAT_INPUT: ${{ inputs.format }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          require_int() {
            case "$2" in
              ''|*[!0-9]*)
                echo "::error::$1 must be a positive integer (got '$2')"
                exit 1
                ;;
            esac
          }
          require_int max_matches "$MAX_MATCHES"
          require_int max_series "$MAX_SERIES"

          ARGS="--output-dir cricinfo --max-matches $MAX_MATCHES --max-series $MAX_SERIES --scan-parquets"

          # Add series filter (manual trigger only)
          if [ -n "$SERIES_INPUT" ]; then
            if [ -n "$(printf '%s' "$SERIES_INPUT" | tr -d '0-9, ')" ]; then
              echo "::error::series_ids must contain only digits, commas and spaces (got '$SERIES_INPUT')"
              exit 1
            fi
            # Convert comma-separated to space-separated for argparse nargs, collapse whitespace
            SERIES_ARGS=$(echo "$SERIES_INPUT" | tr ',' ' ' | tr -s ' ')
            ARGS="$ARGS --series $SERIES_ARGS"
          fi

          # Add format filter
          if [ -n "$FORMAT_INPUT" ]; then
            case "$FORMAT_INPUT" in
              t20i|odi|test) ARGS="$ARGS --format $FORMAT_INPUT" ;;
              *)
                echo "::error::format must be t20i, odi or test (got '$FORMAT_INPUT')"
                exit 1
                ;;
            esac
          fi

          # Add force flag
          if [ "$FORCE_INPUT" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          echo "Running: python scripts/cricinfo_scraper.py $ARGS"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" \
            python scripts/cricinfo_scraper.py $ARGS

      # Refresh fixture statuses across a much wider series window than the
      # ball-by-ball scrape uses (bouncerverse#84 / D-P64).
      #
      # Why the window has to be wider: the ball-by-ball scrape step above runs
      # --max-series 3, and series are picked newest-first per format. Measured
      # against the live release on 2026-09-05, the fixtures stuck at
      # status='PRE' with a start_date already in the past sat at newest-first
      # ranks 3..283 (median 47). A fixture refresh at --max-series 3 would
      # therefore have refreshed 0 of the 1,133 stale rows -- a step that goes
      # green every day and fixes nothing. Coverage measured from the live
      # fixtures.parquet: 3 -> 0, 10 -> 84, 40 -> 484, 80 -> 785, 150 -> ~1,090.
      #
      # Note 1,233 rows are PRE but only 1,133 are stale; the other ~100 are
      # genuinely upcoming matches and are supposed to be PRE.
      #
      # This is affordable daily because --fixtures-only uses an in-browser
      # fetch() instead of page navigation (~4x faster, and it batches a save
      # every 50 series), and save_fixtures() merges by match_id with the newer
      # row winning -- so a stale status corrects itself in place.
      #
      # It runs AFTER the ball-by-ball scrape, not before, on purpose. Visiting
      # up to 450 series in one browser session is the most bot-detection
      # exposure in this job, and the scrape is the part whose failure actually
      # loses data. Doing the cheap, replaceable work last means a refresh that
      # trips Akamai cannot take the scrape down with it.
      #
      # continue-on-error mirrors "Discover new series": a fixtures refresh
      # failing must never fail the job, since the scrape and the uploads that
      # matter have already succeeded by this point.
      - name: Refresh fixture statuses
        id: fixtures
        continue-on-error: true
        env:
          FIXTURES_MAX_SERIES: ${{ inputs.fixtures_max_series || '150' }}
          FORMAT_INPUT: ${{ inputs.format }}
        run: |
          # Inputs arrive via env, never by template interpolation -- see the
          # scrape step above for why.
          case "$FIXTURES_MAX_SERIES" in
            ''|*[!0-9]*)
              echo "::error::fixtures_max_series must be a positive integer (got '$FIXTURES_MAX_SERIES')"
              exit 1
              ;;
          esac

          ARGS="--fixtures-only --output-dir cricinfo --scan-parquets --max-series $FIXTURES_MAX_SERIES"

          if [ -n "$FORMAT_INPUT" ]; then
            case "$FORMAT_INPUT" in
              t20i|odi|test) ARGS="$ARGS --format $FORMAT_INPUT" ;;
              *)
                echo "::error::format must be t20i, odi or test (got '$FORMAT_INPUT')"
                exit 1
                ;;
            esac
          fi

          echo "Running: python scripts/cricinfo_scraper.py $ARGS"
          # pipefail so tee cannot mask the scraper's exit status.
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" \
            python scripts/cricinfo_scraper.py $ARGS 2>&1 | tee "$RUNNER_TEMP/fixtures_refresh.log"

      # "Refresh fixture statuses" is continue-on-error by design, and GitHub
      # sets a continue-on-error step's CONCLUSION to success even when it
      # fails. Job-level failure() therefore never sees it, "Create issue on
      # failure" below never fires, and a refresh that is 100% broken looks
      # identical to a working one from the runs list, from email, and from an
      # open-issue search. That is the same silently-stuck-state problem this
      # refresh exists to cure, reproduced one layer up.
      #
      # Reached through steps.fixtures.OUTCOME, which does see through
      # continue-on-error -- the same idiom "Commit updated series list"
      # already uses on steps.discover.outcome.
      - name: Report fixture-refresh outcome
        if: always()
        env:
          FIXTURES_OUTCOME: ${{ steps.fixtures.outcome }}
        run: |
          echo "- **Fixture-status refresh**: $FIXTURES_OUTCOME" >> $GITHUB_STEP_SUMMARY
          LOG="$RUNNER_TEMP/fixtures_refresh.log"
          if [ -f "$LOG" ] && grep -q "FIXTURES DONE:" "$LOG"; then
            # Surfaces PARTIAL degradation, which the scraper's zero-success
            # guard deliberately does not fail on: there is no measured baseline
            # error rate to set a threshold against, so the counts are reported
            # for a human rather than judged by an invented cutoff.
            echo "  - $(grep -m1 'FIXTURES DONE:' "$LOG")" >> $GITHUB_STEP_SUMMARY
            echo "  - $(grep -m1 'series returned no data' "$LOG" | tr -d '()')" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Alert on fixture-refresh failure
        if: steps.fixtures.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Cricinfo fixture-status refresh is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Dedup on the exact title against OPEN issues, not on a date. The
            // job-level failure issue below keys on the date, which is right for
            // a one-off crash but would let a PERMANENT failure open a fresh
            // issue every morning and let each one age out of attention. One
            // issue that stays open until somebody looks is the point here.
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-failure,cricinfo',
            });
            if (issues.data.some(i => i.title === title)) {
              core.info('An open issue for this already exists; not filing another.');
              return;
            }

            const body = [
              `The "Refresh fixture statuses" step failed in ${runUrl}.`,
              '',
              'That step is `continue-on-error: true` on purpose, so the ball-by-ball',
              'scrape and the predictions dispatch are unaffected and the job still',
              'reports success. This issue exists because that also means the refresh',
              'could otherwise fail every day forever with nothing to show for it.',
              '',
              'Check the step log for the real cause: Akamai bot detection, a',
              '`__NEXT_DATA__` format change, or a timeout. The scraper exits 1 when it',
              'gets zero successful fetches, so this firing means the refresh got',
              'nothing at all rather than merely less than usual.',
              '',
              'Close this once the refresh is confirmed working; a new one opens if it',
              'starts failing again.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['workflow-failure', 'cricinfo'],
            });

      - name: Create release if needed
        run: |
          gh release view cricinfo 2>/dev/null || \
            gh release create cricinfo \
              --title "Cricinfo Data" \
              --notes "Per-match tables: balls (Hawkeye), match metadata, innings scorecards"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build combined parquets
        run: python scripts/combine_cricinfo_parquets.py --cricinfo-dir cricinfo --merge

      - name: Upload results to release
        run: |
          UPLOADED=0
          FAILED=0
          SKIPPED=0
          MANIFEST=/tmp/cricinfo_restored.md5
          [ -f "$MANIFEST" ] || touch "$MANIFEST"
          # Skip a file that is byte-identical to the copy already on the release.
          # See the manifest comment in "Restore previous data from release" for why
          # (bouncerverse#84 / D-P64): re-uploading unchanged assets reset every
          # asset's updatedAt daily, which permanently blocked the consolidation
          # script's age guard from ever reclaiming cap headroom.
          unchanged() {
            grep -qxF "$(md5sum "$1")" "$MANIFEST"
          }
          mkdir -p /tmp/cricinfo_upload
          for dir in t20i_male t20i_female odi_male odi_female test_male test_female; do
            DIR="cricinfo/$dir"
            if [ -d "$DIR" ]; then
              for f in "$DIR"/*.parquet; do
                [ -f "$f" ] || continue
                if unchanged "$f"; then
                  SKIPPED=$((SKIPPED + 1))
                  continue
                fi
                # Prefix asset name with dir so download can sort by format_gender
                PREFIXED="/tmp/cricinfo_upload/${dir}__$(basename "$f")"
                cp "$f" "$PREFIXED"
                if gh release upload cricinfo "$PREFIXED" --clobber; then
                  UPLOADED=$((UPLOADED + 1))
                else
                  FAILED=$((FAILED + 1))
                  echo "::error::Failed to upload $PREFIXED"
                fi
              done
            fi
          done
          rm -rf /tmp/cricinfo_upload
          # Upload fixtures.parquet (top-level, not in a format subdirectory)
          if [ -f "cricinfo/fixtures.parquet" ]; then
            if unchanged "cricinfo/fixtures.parquet"; then
              SKIPPED=$((SKIPPED + 1))
            elif gh release upload cricinfo "cricinfo/fixtures.parquet" --clobber; then
              UPLOADED=$((UPLOADED + 1))
            else
              FAILED=$((FAILED + 1))
              echo "::error::Failed to upload fixtures.parquet"
            fi
          fi
          # Upload combined parquets for remote R loader access
          for f in cricinfo/combined/cricinfo_*.parquet; do
            [ -f "$f" ] || continue
            if gh release upload cricinfo "$f" --clobber; then
              UPLOADED=$((UPLOADED + 1))
            else
              FAILED=$((FAILED + 1))
              echo "::error::Failed to upload $f"
            fi
          done
          TOTAL=$(find cricinfo -name "*.parquet" 2>/dev/null | wc -l)
          echo "Uploaded $UPLOADED / $TOTAL parquet files ($SKIPPED unchanged, $FAILED failed)"
          echo "## Cricinfo Scrape Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Total parquet files**: $TOTAL" >> $GITHUB_STEP_SUMMARY
          echo "- **Uploaded this run**: $UPLOADED" >> $GITHUB_STEP_SUMMARY
          echo "- **Skipped as unchanged**: $SKIPPED" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed this run**: $FAILED" >> $GITHUB_STEP_SUMMARY
          # Per-file upload failures used to be warn-only (silently degrading once the
          # release neared GitHub's 1000-asset cap — see ../../../docs/reviews/FABLE-REVIEW.md H7). Any
          # failure now fails the job so it surfaces as a workflow failure/issue
          # instead of a buried warning in the logs.
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED asset upload(s) failed this run. New/updated matches may be missing from the release; re-run the workflow after investigating (check the asset-count guard step above first)."
            exit 1
          fi
          # A run where everything was already up to date is a SUCCESS, not a
          # failure -- since D-P64 unchanged per-match assets are skipped rather
          # than re-uploaded, so UPLOADED can legitimately be small. Only treat it
          # as "all uploads failed" when nothing was uploaded AND nothing was
          # skipped, i.e. we genuinely got nothing onto the release.
          if [ "$UPLOADED" -eq 0 ] && [ "$SKIPPED" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
            echo "::error::All uploads failed ($TOTAL files available, 0 uploaded, 0 skipped as unchanged)"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch predictions trigger
        if: success()
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          gh api repos/peteowen1/bouncer/dispatches \
            -f event_type=cricinfo-complete
          echo "Dispatched predictions trigger to bouncer"

      # Same rule as the scrape step: the dispatch inputs come in through env
      # and are read with process.env, not interpolated into the script. This is
      # a JS template literal, so an input containing a backtick or ${...} would
      # otherwise be evaluated as JavaScript inside the runner.
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v9
        env:
          SERIES_INPUT: ${{ inputs.series_ids }}
          FORMAT_INPUT: ${{ inputs.format }}
        with:
          script: |
            const seriesIds = process.env.SERIES_INPUT || 'scheduled (auto from CSV)';
            const formatFilter = process.env.FORMAT_INPUT || 'all';
            const title = `Cricinfo Scrape Failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `## Workflow Failure

            The Cricinfo scrape workflow failed.

            - **Run ID**: ${{ github.run_id }}
            - **Run URL**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Triggered by**: ${{ github.event_name }}
            - **Series IDs**: ${seriesIds}
            - **Format**: ${formatFilter}

            ### Common Failure Causes
            - Akamai bot detection (stealth patches may need updating)
            - Playwright/Chromium compatibility issue
            - Xvfb display server failure
            - ESPN Cricinfo site structure change (__NEXT_DATA__ format)

            Please check the workflow logs for details.
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-failure,cricinfo'
            });

            const today = new Date().toISOString().split('T')[0];
            const existingIssue = issues.data.find(i => i.title.includes(today));

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['workflow-failure', 'cricinfo']
              });
            }
