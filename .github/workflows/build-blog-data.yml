name: Build blog data

on:
  workflow_dispatch:
  repository_dispatch:
    types: [predictions-complete]
  workflow_run:
    workflows: ["Cricinfo Scrape"]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: bouncer-r2-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Only skip when triggered by a failed/cancelled upstream workflow_run -
    # workflow_dispatch and repository_dispatch (predictions-complete) always run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: arrow, dplyr

      - name: Download source parquets
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          mkdir -p source
          for fmt in t20 odi test; do
            gh release download player_rating -p "${fmt}_player_skill.parquet" -D source
            gh release download team_rating   -p "${fmt}_team_skill.parquet"   -D source
            gh release download venue_rating  -p "${fmt}_venue_skill.parquet"  -D source
          done

      # players.parquet is REQUIRED: every blog table keys on player names, and
      # build_blog_data.R falls back to raw IDs without it. This step used to be
      # continue-on-error, so a transient release failure published a live blog
      # full of UUIDs on a green run. Only the optional enrichment may fail.
      # Player Rating v2. Not `continue-on-error`: if the release is
      # unreachable we would publish a blog with the v2 tables silently
      # missing, which looks identical to "no ratings exist".
      - name: Download player rating v2
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          gh release download player-rating-v2 -p "player_rating_v2.parquet" -D source
          gh release download player-rating-v2 -p "player_value_v2.parquet"  -D source

      - name: Download player registry (required)
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: gh release download cricsheet -p "players.parquet" -D source

      - name: Download player enrichment (optional)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          gh release download player_details -p "bouncer_player_details.parquet" -D source

      - name: Download cricinfo balls data
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          mkdir -p cricinfo/combined
          for fmt in t20i odi test; do
            for type in balls innings; do
              if gh release download cricinfo -p "cricinfo_${type}_${fmt}_male.parquet" -D cricinfo/combined/; then
                echo "Downloaded cricinfo_${type}_${fmt}_male.parquet"
              else
                echo "::warning::cricinfo_${type}_${fmt}_male.parquet not available"
              fi
            done
          done

      - name: Download predictions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          mkdir -p blog
          if gh release download predictions-latest -p "predictions.parquet" -D blog/; then
            echo "Downloaded predictions.parquet"
          else
            echo "::warning::predictions.parquet not available yet"
          fi

      - name: Aggregate
        run: Rscript scripts/build_blog_data.R

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          shopt -s nullglob
          files=(blog/*.parquet)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No parquet files found in blog/ — skipping upload"
            exit 0
          fi
          for f in "${files[@]}"; do
            # Cache-Control lets browsers/CF cache + revalidate via ETag (304)
            # instead of re-downloading megabytes (inthegame-blog #388).
            wrangler r2 object put "inthegame-data/cricket/$(basename "$f")" --file "$f" --cache-control "public, max-age=300" --remote
          done

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = `Build Blog Data Failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `## Workflow Failure

            The build-blog-data workflow failed.

            - **Run ID**: ${{ github.run_id }}
            - **Run URL**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Triggered by**: ${{ github.event_name }}

            Please check the workflow logs for details.
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-failure'
            });

            const today = new Date().toISOString().split('T')[0];
            const existingIssue = issues.data.find(i => i.title.includes(today) && i.title.includes('Blog'));

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['workflow-failure']
              });
            }
